# 生产环境配置

spring:
  # 数据源配置（生产环境请修改为实际配置）
  datasource:
    url: jdbc:mysql://localhost:3306/yueya_care?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai
    username: root
    password: your-production-password
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  
  # Redis配置（生产环境请修改为实际配置）
  redis:
    host: localhost
    port: 6379
    password: your-redis-password
    database: 0

# 服务器配置
server:
  port: 8080

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    # 生产环境关闭SQL打印
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 日志配置
logging:
  level:
    root: warn
    com.lidexin.mymodle: info
    com.baomidou.mybatisplus: warn

# 项目配置
mymodle:
  # JWT配置（生产环境请修改密钥）
  jwt:
    secret: change-this-secret-key-in-production-must-be-very-long-and-random-string
  
  # 接口文档配置（生产环境建议关闭）
  swagger:
    enabled: false

