# 开发环境配置

spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/yueya_care?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 12345 # 无密码
    database: 0

# 服务器配置
server:
  port: 8080

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    # 开发环境打印SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    root: info
    com.lidexin.mymodle: debug
    com.baomidou.mybatisplus: debug
    org.springframework.web: debug
    org.springframework.cache: trace  # 缓存详细日志
    com.lidexin.mymodle.mapper: debug  # Mapper SQL日志

# 项目配置
mymodle:
  # 接口文档配置（开发环境启用）
  swagger:
    enabled: true

